# Continuous integration for the Zuuchmap workspace (apps/*, packages/*). Each
# package gates on its own scripts; the root gate:* scripts proxy them.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push to the same branch makes the first run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Tokens, core, engine, web, app
    runs-on: ubuntu-latest
    # The engine e2e specs need PostGIS and Redis; they use `zuuchmap_test`
    # (test/global-setup.ts), with the rest of the env from apps/engine/.env.example.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: zuuchmap
          POSTGRES_PASSWORD: zuuchmap
          POSTGRES_DB: zuuchmap
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zuuchmap -d zuuchmap"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Tokens
        run: npm run gate:tokens
      - name: Core — build, tests
        run: npm run gate:core
      - name: Engine — typecheck, lint, tests, build
        run: npm run gate:engine
      - name: Web — typecheck, lint, build
        run: npm run gate:web
      - name: App — typecheck, lint, bundle
        run: npm run gate:app
