services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: zuuchmap
      POSTGRES_PASSWORD: zuuchmap
      POSTGRES_DB: zuuchmap
    ports:
      - "5433:5432"
    volumes:
      - zuuchmap_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuuchmap -d zuuchmap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - zuuchmap_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outbound e-mail in development: SMTP on 1025, inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  zuuchmap_pg:
  zuuchmap_redis:
