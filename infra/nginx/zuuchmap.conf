# Production site config. Install as /etc/nginx/sites-available/zuuchmap.conf when the
# new stack goes live on the VPS (it replaces the old site's config there).
#
# Certificates: `certbot certonly --nginx -d zuuchmap.com -d www.zuuchmap.com` writes
#   /etc/letsencrypt/live/zuuchmap.com/{fullchain.pem,privkey.pem}
# and renews them through its systemd timer.
# Brotli needs ngx_brotli; if the module is absent, delete the two brotli lines.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zuuchmap.com www.zuuchmap.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://zuuchmap.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zuuchmap.com www.zuuchmap.com;

    ssl_certificate     /etc/letsencrypt/live/zuuchmap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuuchmap.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    if ($host = www.zuuchmap.com) { return 301 https://zuuchmap.com$request_uri; }

    root /var/www/zuuchmap/dist;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf application/manifest+json;
    # brotli on;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # Hashed build output: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8383;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Socket.io (websocket-only transport)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8383;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /seo/ {
        proxy_pass http://127.0.0.1:8383/api/seo/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
