# Zuuchmap Postgres tuning, for the server (myserver: 15 GB RAM, 8 cores, SSD, Postgres 18,
# shared with microk8s). Install as /etc/postgresql/18/main/conf.d/zuuchmap.conf, then
# `sudo systemctl restart postgresql` (shared_buffers and shared_preload_libraries need a restart).
#
# Memory is sized for a shared box; on a machine of its own, raise shared_buffers to 25% of RAM
# and effective_cache_size to 70%.

shared_buffers = 2GB
effective_cache_size = 8GB
maintenance_work_mem = 512MB
work_mem = 16MB                     # per sort/hash node; browse sorts are small, the admin analytics are not

# SSD storage: an index page is barely dearer than a sequential one.
random_page_cost = 1.1
effective_io_concurrency = 200

# Short OLTP queries: compiling them costs more than it saves (the engine also sets this per connection).
jit = off

# The engine's pool is 10 connections per worker; headroom for psql, backups and cron.
max_connections = 50
idle_in_transaction_session_timeout = 60s

# Which queries are slow. After the restart, once, as postgres in the zuuchmap database:
#   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 500ms  # anything slower than this goes to the server log
