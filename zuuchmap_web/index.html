<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Commissioner, self-hosted as ONE variable file (wght 400-800) covering
         latin + latin-ext + cyrillic + cyrillic-ext in a single face.
         Google Fonts splits those into four unicode-range subsets, and Ө
         (U+04E8) / Ү (U+04AE) / ₮ (U+20AE) live in *different* files from the
         rest of Mongolian text — so they lazily fell back to system-ui and
         rendered in a visibly different face mid-word. One face, no
         unicode-range, so that can never happen. @font-face is in index.css. -->
    <link rel="preload" href="/fonts/commissioner-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="canonical" href="https://zuuchmap.com/" />

    <title>ZuuchMap — Барилгын зах зээл | Машин механизм, материал, гүйцэтгэгч</title>
    <meta name="description" content="Монголын барилгын зах зээл. Машин механизм, тээврийн хэрэгсэл, багаж түрээслэх, барилгын материал, үйлдвэр, гүйцэтгэгч, ажлын байр, SOS үйлчилгээ — 21 аймагт." />
    <!-- Content is set by the theme bootstrap script below — the stored
         zm_theme decides, not prefers-color-scheme. -->
    <meta name="theme-color" content="#17181A" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZuuchMap" />
    <meta property="og:locale" content="mn_MN" />
    <meta property="og:url" content="https://zuuchmap.com/" />
    <meta property="og:title" content="ZuuchMap — Барилгын зах зээл" />
    <meta property="og:description" content="Машин механизм, багаж түрээслэх, материал авах, гүйцэтгэгч сонгох, ажлын байр — Монголын 21 аймагт." />
    <meta property="og:image" content="https://zuuchmap.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZuuchMap — Барилгын зах зээл" />
    <meta name="twitter:description" content="Машин механизм, багаж түрээслэх, материал авах, гүйцэтгэгч сонгох, ажлын байр — Монголын 21 аймагт." />
    <meta name="twitter:image" content="https://zuuchmap.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ZuuchMap",
        "url": "https://zuuchmap.com/",
        "description": "Монголын барилгын зах зээл — машин механизм, материал, гүйцэтгэгч, ажлын байр.",
        "inLanguage": "mn"
      }
    </script>

    <script>
      (function() {
        var t = localStorage.getItem('zm_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#FAFAF8' : '#17181A');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
